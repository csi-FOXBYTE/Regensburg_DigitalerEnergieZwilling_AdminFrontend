name: Tag Build and Deploy

on:
  push:
    tags:
      - "*"

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: tag-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release channel from tag
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" == *"-dev."* ]]; then
            echo "name=dev" >> "${GITHUB_OUTPUT}"
          else
            echo "name=prod" >> "${GITHUB_OUTPUT}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "name=${image}"
            echo "tags<<EOF"
            echo "${image}:${{ steps.channel.outputs.tag }}"
            if [[ "${{ steps.channel.outputs.name }}" == "dev" ]]; then
              echo "${image}:dev"
            else
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@csi-foxbyte"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Generate release SBOM
        env:
          SBOM_VERSION: ${{ steps.channel.outputs.tag }}
        run: pnpm run sbom

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.licenses=LGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.channel.outputs.tag }}
          secrets: |
            github_token=${{ secrets.PACKAGE_TOKEN }}

      - name: Attest image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: SBOM.cdx.json
          push-to-registry: true
          create-storage-record: false
